name: NyaTerm branch

# gpui-component's patch branch declares gpui, gpui_macros and gpui_platform
# against upstream zed-industries/zed, unpinned, and upstream's ci.yml only
# triggers on `main`. Both are deliberate: the branch carries no vendor-layout
# changes so it rebases cleanly. This workflow pins the exact zed revision
# NyaTerm uses through a config-level [patch], which leaves the branch's
# manifest untouched, and runs the base-scoped checks that make sense for this
# branch.
#
# The [patch] is appended to the repository's existing .cargo/config.toml, which
# already carries a Windows linker flag. Cargo re-reads that file on each
# invocation, so later steps see it too.
#
# The zed URL must match the manifest's string exactly, including the absent
# `.git` suffix. `gpui` is pinned by version because the zed repository also
# contains tooling/lints/test_fixture/gpui at 0.0.0, and a bare git reference
# is ambiguous.

on:
  push:
    branches: ["nyaterm"]
  pull_request:
    branches: ["nyaterm"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: base + gpui-base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gpui_platform is built with x11, wayland and font-kit, so GPUI's system
      # libraries have to be present. Reuse the repository's own script rather
      # than a hand-kept package list, so a rebase picks up upstream's changes.
      - name: Install system dependencies
        run: script/bootstrap

      - name: Pin the zed fork NyaTerm uses
        run: |
          # Append: the repository already tracks .cargo/config.toml for a
          # Windows linker flag, and overwriting it would drop that.
          cat >> .cargo/config.toml <<'EOF'
          [patch."https://github.com/zed-industries/zed"]
          gpui = { version = "=0.2.2", git = "https://github.com/nyakang/zed", rev = "275f31ac7293280e86763ec33933d4b6a4508847" }
          gpui_macros = { git = "https://github.com/nyakang/zed", rev = "275f31ac7293280e86763ec33933d4b6a4508847" }
          gpui_platform = { git = "https://github.com/nyakang/zed", rev = "275f31ac7293280e86763ec33933d4b6a4508847" }
          EOF
          # Assert the fork's own gpui resolves, not upstream's.
          cargo metadata --format-version 1 | grep -c 'nyakang/zed?rev=275f31ac'

      - name: Base crate tests
        run: cargo test -p gpui-base

      - name: Scrollbar reveal tests
        run: cargo test -p gpui-base reveal

      - name: Component crate check
        run: cargo check -p gpui-component
